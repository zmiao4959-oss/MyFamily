services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_memory}
      POSTGRES_USER: ${POSTGRES_USER:-family_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-family_memory} -d ${POSTGRES_DB:-family_memory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./local-server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-family_memory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-family_memory}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - media_data:/data/media
      - backup_data:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: ./local-server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-family_memory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-family_memory}
    volumes:
      - media_data:/data/media
      - backup_data:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

volumes:
  postgres_data:
  media_data:
  backup_data:
